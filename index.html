<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recicla JGQ</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class ="cards">
        <div class="card reciclavel">
            <div class="icone">
                <i class="fa-solid fa-recycle"></i>
            </div>
            <h2>Resíduos recicláveis</h2>
            <p>Plásticos, vidro, papel, papelão e metais que podem ser transformados em novos produtos</p>
            <a href="" class="button">Ver produtos recicláveis</a>
        </div>

        <div class="card n-reciclavel">
            <div class="icone">
                <i class="fa-solid fa-trash"></i>
            </div>
            <h2>Resíduos não recicláveis</h2>
            <p>Resíduos orgânicos, materiais contaminados e produtos que não podem ser reciclados</p>
            <a href="" class="button">Ver produtos não recicláveis</a>
        </div>
    </div>
</body>
</html>
